name: Stride
options:
  bundleIdPrefix: co.nsgsolutions
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: S6QW7SV228
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "13"

targets:
  Stride:
    type: application
    platform: iOS
    sources:
      - path: Stride
      - path: Shared
      - path: Stride/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: StrideWatch
      - target: StrideWidget
    entitlements:
      path: Stride/Stride.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.co.nsgsolutions.stride]
    info:
      path: Stride/Info.plist
      properties:
        CFBundleDisplayName: Stride
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Stride reads your runs so it can chart your progress.
        NSHealthUpdateUsageDescription: Stride saves runs you record from your watch to Health.
        WKCompanionAppBundleIdentifier: co.nsgsolutions.Stride
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.nsgsolutions.Stride
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [StrideTests]

  StrideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StrideTests
    dependencies:
      - target: Stride
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.nsgsolutions.StrideTests
        GENERATE_INFOPLIST_FILE: YES

  StrideWatch:
    type: application
    platform: watchOS
    sources:
      - path: StrideWatch
        excludes: ["Voice"]
      - path: Shared
      - path: StrideWatch/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The coach's recorded clips, kept as a folder so the bundle has Voice/<clip>.m4a.
      - path: StrideWatch/Voice
        type: folder
        buildPhase: resources
    dependencies:
      - target: StrideWatchWidget
    entitlements:
      path: StrideWatch/StrideWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.co.nsgsolutions.stride]
    info:
      path: StrideWatch/Info.plist
      properties:
        CFBundleDisplayName: Stride
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: co.nsgsolutions.Stride
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [workout-processing]
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: Stride reads heart rate and distance during your run to coach your pace.
        NSHealthUpdateUsageDescription: Stride saves your runs as workouts in Health.
        NSLocationWhenInUseUsageDescription: Stride uses GPS to measure your distance and pace while you run.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.nsgsolutions.Stride.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  StrideWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: StrideWidget
      - path: Shared/Models
      - path: Shared/Planning
      - path: Shared/Store
    entitlements:
      path: StrideWidget/StrideWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.co.nsgsolutions.stride]
    info:
      path: StrideWidget/Info.plist
      properties:
        CFBundleDisplayName: Stride
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.nsgsolutions.Stride.widget
        SKIP_INSTALL: YES

  StrideWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: StrideWidget
        excludes: ["Info.plist", "*.entitlements"]
      - path: Shared/Models
      - path: Shared/Planning
      - path: Shared/Store
    entitlements:
      path: StrideWatchWidget/StrideWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.co.nsgsolutions.stride]
    info:
      path: StrideWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Stride
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.nsgsolutions.Stride.watchkitapp.widget
        SKIP_INSTALL: YES
